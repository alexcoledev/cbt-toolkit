name: Validate Tools

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML files exist
        run: |
          count=$(find . -name "*.html" -not -path "./.git/*" | wc -l)
          echo "Found $count HTML files"
          if [ "$count" -lt 20 ]; then
            echo "ERROR: Expected at least 20 HTML files"
            exit 1
          fi
      - name: Check README exists
        run: test -f README.md
      - name: Check core tool pages exist
        run: |
          test -f seo/cognitive-distortion-checker.html || exit 1
          test -f seo/cbt-context-belief-detector.html || exit 1
          echo "All core tool pages present"
